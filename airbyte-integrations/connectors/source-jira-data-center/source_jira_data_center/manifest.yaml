    primary_key: "accountId"
    retriever:
      $ref: "#/definitions/retriever_no_pagination"
      partition_router:
        type: SubstreamPartitionRouter
        parent_stream_configs:
          - type: ParentStreamConfig
            stream: "#/definitions/users_stream"
            parent_key: "accountId"
            partition_field: "user_account_id"
      requester:
        $ref: "#/definitions/requester"
        request_parameters:
          accountId: "{{ stream_slice.user_account_id }}"
          expand: "groups,applicationRoles"
      record_selector:
        $ref: "#/definitions/selector"
        extractor:
          type: DpathExtractor
          field_path: []
    $parameters:
      path: "user"

  # Incremental Streams

  semi_incremental_retriever:
    $ref: "#/definitions/retriever"
    record_selector:
      $ref: "#/definitions/selector"
      record_filter:
        condition: "{{ record['updated'] >= stream_slice['start_time'] }}"

  incremental_sync:
    type: DatetimeBasedCursor
    cursor_field: "updated"
    start_datetime: "{{ config.get('start_date', '1970-01-01T00:00:00Z') }}"
    datetime_format: "%Y-%m-%dT%H:%M:%SZ"
    cursor_datetime_formats:
      - "%Y-%m-%dT%H:%M:%S.%f%z"
    lookback_window: "PT{{ config.get('lookback_window_minutes', '0') }}M"

  incremental_stream:
    type: DeclarativeStream
    retriever: "#/definitions/retriever"
    incremental_sync: "#/definitions/incremental_sync"

  semi_incremental_stream:
    $ref: "#/definitions/incremental_stream"
    retriever: "#/definitions/semi_incremental_retriever"

  # https://developer.atlassian.com/server/jira/platform/rest/v10002/api-group-board/#api-rest-agile-1-0-board-boardid-issue-get
  board_issues_stream:
