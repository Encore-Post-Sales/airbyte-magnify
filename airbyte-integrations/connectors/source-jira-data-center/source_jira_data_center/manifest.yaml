    name: board_issues
    primary_key: "id"
    retriever:
      $ref: "#/definitions/retriever"
      partition_router:
        type: SubstreamPartitionRouter
        parent_stream_configs:
          - type: ParentStreamConfig
            stream: "#/definitions/boards_stream"
            parent_key: "id"
            partition_field: "board_id"
      requester:
        $ref: "#/definitions/requester_v1"
        request_parameters:
          fields: "['key', 'created', 'updated']"
          jql: "updated >= '{{ format_datetime(stream_slice.start_time, '%Y/%m/%d %H:%M') }}'"
        error_handler:
          $ref: "#/definitions/error_handler"
          response_filters:
            - http_codes: [500]
              action: IGNORE
    transformations:
      - type: AddFields
        fields:
          - path: ["boardId"]
            value_type: integer
            value: "{{ stream_slice.board_id }}"
          - path: ["created"]
            value_type: string
            value: "{{ record.fields.created }}"
          - path: ["updated"]
            value_type: string
            value: "{{ record.fields.updated }}"
    $parameters:
      path: "board/{{ stream_slice.board_id }}/issue"
      extract_field: "issues"

  # https://developer.atlassian.com/server/jira/platform/rest/v10002/api-group-search/#api-rest-api-2-search-get
  issues_stream:
    $ref: "#/definitions/incremental_stream"
    name: issues
    primary_key: "id"
    retriever:
      $ref: "#/definitions/retriever"
      partition_router:
        type: CustomPartitionRouter
        class_name: "source_jira_data_center.components.partition_routers.SubstreamOrSinglePartitionRouter"
        parent_stream_configs:
          - type: ParentStreamConfig
            stream: "#/definitions/projects_stream"
            parent_key: "id"
            partition_field: "project_id"
      requester:
        $ref: "#/definitions/requester"
        request_parameters:
          fields: "*all"
          jql: >
            "updated >= '{{ format_datetime(stream_slice.start_time, '%Y/%m/%d %H:%M') }}' "
            "{{ ('and project in ' + '(' + stream_slice.project_id + ') ') if stream_slice.project_id else '' }}"
            "ORDER BY updated asc"
          expand: "renderedFields,transitions,changelog"
        error_handler:
          $ref: "#/definitions/error_handler"
          response_filters:
            - http_codes: [400]
              error_message: "The user doesn't have permission to the project. Please grant the user to the project."
              action: IGNORE
    transformations:
      - type: AddFields
        fields:
          - path: ["projectId"]
            value_type: string
            value: "{{ record.fields.project.id }}"
          - path: ["projectKey"]
            value_type: string
            value: "{{ record.fields.project.key }}"
          - path: ["created"]
            value_type: string
            value: "{{ record.fields.created }}"
          - path: ["updated"]
            value_type: string
            value: "{{ record.fields.updated }}"
      - type: CustomTransformation
        class_name: "source_jira_data_center.components.transformations.RemoveEmptyFields"
        field_pointers: ["renderedFields", "fields"]

    $parameters:
      path: "search"
      extract_field: "issues"

  # https://developer.atlassian.com/server/jira/platform/rest/v10002/api-group-field/#api-rest-api-2-field-get
  __story_points_issue_fields_substream:
    $ref: "#/definitions/issue_fields_stream"
    retriever:
      $ref: "#/definitions/retriever_no_pagination_use_cache"
      record_selector:
        $ref: "#/definitions/selector_base"
        record_filter:
          condition: "{{ record.name in ['Story Points', 'Story point estimate'] }}"

  # https://developer.atlassian.com/server/jira/platform/rest/v10002/api-group-sprint/#api-rest-agile-1-0-sprint-sprintid-issue-get
  sprint_issues_stream:
    $ref: "#/definitions/incremental_stream"
    name: sprint_issues
    primary_key: "id"
    retriever:
      $ref: "#/definitions/retriever_v1"
      partition_router:
        type: CustomPartitionRouter
        class_name: "source_jira_data_center.components.partition_routers.SprintIssuesSubstreamPartitionRouter"
        parent_stream_configs:
          - type: ParentStreamConfig
            stream: "#/definitions/__story_points_issue_fields_substream"
            parent_key: "id"
            partition_field: "field_id"
          - type: ParentStreamConfig
            stream: "#/definitions/sprints_stream"
            parent_key: "id"
            partition_field: "sprint_id"
      requester:
        $ref: "#/definitions/retriever_v1/requester"
        request_parameters:
          fields: "{{ stream_slice._partition.parent_stream_fields }}"
          jql: "updated >= '{{ format_datetime(stream_slice.start_time, '%Y/%m/%d %H:%M') }}'"
    transformations:
      - type: AddFields
        fields:
          - path: ["issueId"]
            value_type: string
            value: "{{ record.id }}"
          - path: ["id"]
            value_type: string
            value: "{{ stream_slice.sprint_id }}-{{ record.id }}"
          - path: ["sprintId"]
            value_type: integer
            value: "{{ stream_slice.sprint_id }}"
          - path: ["created"]
            value_type: string
            value: "{{ record.fields.created }}"
          - path: ["updated"]
            value_type: string
            value: "{{ record.fields.updated }}"
    $parameters:
      path: "sprint/{{ stream_slice.sprint_id }}/issue"
      extract_field: "issues"

