# Jira Data Center source connector.
# Uses Jira REST API v2 (base path /rest/api/2/). Documentation: https://developer.atlassian.com/server/jira/platform/rest/v10002/intro/
version: 0.72.1
type: DeclarativeSource

definitions:
  # Authenticators

  authenticator:
    type: BearerAuthenticator
    api_token: "{{ config['personal_access_token'] }}"

  # Error handler
  error_handler:
    type: DefaultErrorHandler
    max_retries: 10
    response_filters:
      - http_codes: [400]
        action: IGNORE

  # Error handler for streams that may not exist on all Data Center versions (e.g. fieldconfiguration, screenscheme)
  error_handler_ignore_404:
    type: DefaultErrorHandler
    max_retries: 10
    response_filters:
      - http_codes: [400, 403, 404]
        action: IGNORE

  # Requesters

  requester:
    type: HttpRequester
    http_method: GET
    url_base: "https://{{ config['domain'] }}/rest/api/2/"
    authenticator: "#/definitions/authenticator"
    error_handler: "#/definitions/error_handler"

  requester_v1:
    $ref: "#/definitions/requester"
    url_base: "https://{{ config['domain'] }}/rest/agile/1.0/"

  # Selector

  selector:
    type: RecordSelector
    extractor:
      type: DpathExtractor
      field_path: ["{{ parameters.extract_field }}"]

  selector_base:
    type: RecordSelector
    extractor:
      type: DpathExtractor
      field_path: []

  # Paginator

  no_pagination_paginator:
    type: NoPagination

  paginator:
    type: "DefaultPaginator"
    page_size_option:
      type: RequestOption
      inject_into: request_parameter
      field_name: maxResults
    page_token_option:
      type: RequestOption
      inject_into: "request_parameter"
      field_name: "startAt"
    # Why not OffsetPagination:
    # Due to the record_filter, we may end up with a reduced number of records.
    # For instance, a response has 50 records and the page_size option is also set to 50,
    # but the record_filter results in filtering out 40 records, leaving us with only 10.
    # During the calculation of the next_page_token, there is a check to ensure that
    # the number of records is not less than the given page_size.
    # If this condition is not met, None is returned, resulting in end of pagination.
    pagination_strategy:
      type: CursorPagination
      cursor_value: "{{ response.get('startAt') + response['maxResults'] }}"
      stop_condition: "{{ response.get('isLast') or response.get('startAt') + response.get('maxResults') >= response.get('total') }}"
      page_size: 50

  # Retriever

  retriever:
    record_selector: "#/definitions/selector"
    requester: "#/definitions/requester"
    paginator: "#/definitions/paginator"

  retriever_no_pagination:
    $ref: "#/definitions/retriever"
    paginator: "#/definitions/no_pagination_paginator"

  retriever_use_cache:
    $ref: "#/definitions/retriever"
    requester:
      $ref: "#/definitions/retriever/requester"
      use_cache: true

  retriever_no_pagination_use_cache:
    $ref: "#/definitions/retriever_use_cache"
    paginator: "#/definitions/no_pagination_paginator"

  retriever_v1:
    $ref: "#/definitions/retriever"
    requester: "#/definitions/requester_v1"

  retriever_v1_use_cache:
    $ref: "#/definitions/retriever_v1"
    requester:
      $ref: "#/definitions/retriever_v1/requester"
      use_cache: true

  # Service Streams

  full_refresh_stream:
    type: DeclarativeStream
    retriever: "#/definitions/retriever"

  # Full Refresh Streams

  # https://developer.atlassian.com/server/jira/platform/rest/v10002/api-group-applicationrole/#api-rest-api-2-applicationrole-get
  application_roles_stream:
    $ref: "#/definitions/full_refresh_stream"
    name: application_roles
    primary_key: "key"
    retriever:
      $ref: "#/definitions/retriever_no_pagination"
      record_selector: "#/definitions/selector_base"
    $parameters:
      path: "applicationrole"

  # https://developer.atlassian.com/server/jira/platform/rest/v10002/api-group-avatar/#api-rest-api-2-avatar-type-system-get
  avatars_stream:
    $ref: "#/definitions/full_refresh_stream"
    name: avatars
    primary_key: "id"
    retriever:
      $ref: "#/definitions/retriever_no_pagination"
      partition_router:
        type: ListPartitionRouter
        cursor_field: "slice"
        values:
          - issuetype
          - project
          - user
    $parameters:
      path: "avatar/{{ stream_slice.slice }}/system"
      extract_field: "system"

  # https://developer.atlassian.com/server/jira/platform/rest/v10002/api-group-board/#api-agile-1-0-board-get
  boards_stream:
    $ref: "#/definitions/full_refresh_stream"
    name: boards
    primary_key: "id"
    retriever:
      $ref: "#/definitions/retriever_v1_use_cache"
      record_selector:
        $ref: "#/definitions/selector"
        record_filter:
          condition: "{{ not config.get('projects') or record.get('location', {}).get('projectKey') in config['projects'] }}"
    transformations:
      - type: AddFields
        fields:
          - path: ["projectId"]
            value_type: string
            value: "{{ record.get('location', {}).get('projectId', '') }}"
          - path: ["projectKey"]
            value_type: string
            value: "{{ record.get('location', {}).get('projectKey', '') }}"
    $parameters:
      path: "board"
      extract_field: "values"

  # https://developer.atlassian.com/server/jira/platform/rest/v10002/api-group-dashboard/#api-rest-api-2-dashboard-get
  dashboards_stream:
    $ref: "#/definitions/full_refresh_stream"
    name: dashboards
    primary_key: "id"
    $parameters:
      path: "dashboard"
      extract_field: "dashboards"

  # https://developer.atlassian.com/server/jira/platform/rest/v10002/api-group-filter/#api-rest-api-2-filter-search-get
  filters_stream:
    $ref: "#/definitions/full_refresh_stream"
    name: filters
    primary_key: "id"
    retriever:
      $ref: "#/definitions/retriever_use_cache"
      requester:
        $ref: "#/definitions/retriever_use_cache/requester"
        request_parameters:
          expand: "description,owner,jql,viewUrl,searchUrl,favourite,favouritedCount,sharePermissions,isWritable,subscriptions"
    $parameters:
      path: "filter/search"
      extract_field: "values"

  # https://developer.atlassian.com/server/jira/platform/rest/v10002/api-group-groups/#api-rest-api-2-group-bulk-get
  groups_stream:
    $ref: "#/definitions/full_refresh_stream"
    name: groups
    primary_key: "groupId"
    $parameters:
      path: "group/bulk"
      extract_field: "values"

  # https://developer.atlassian.com/server/jira/platform/rest/v10002/api-group-field/#api-rest-api-2-field-get
  issue_fields_stream:
    $ref: "#/definitions/full_refresh_stream"
    name: issue_fields
    primary_key: "id"
    retriever:
      $ref: "#/definitions/retriever_no_pagination_use_cache"
      record_selector: "#/definitions/selector_base"
    $parameters:
      path: "field"

  # Field configurations; may not exist on all Data Center versions (ignore 404/403).
  # https://developer.atlassian.com/server/jira/platform/rest/v10002/api-group-field/
  issue_field_configurations_stream:
    $ref: "#/definitions/full_refresh_stream"
    name: issue_field_configurations
    primary_key: "id"
    retriever:
      $ref: "#/definitions/retriever"
      requester:
        $ref: "#/definitions/requester"
        error_handler: "#/definitions/error_handler_ignore_404"
    $parameters:
      path: "fieldconfiguration"
      extract_field: "values"

  # https://developer.atlassian.com/server/jira/platform/rest/v10002/api-group-issuelinktype/#api-rest-api-2-issuelinktype-get
  issue_link_types_stream:
    $ref: "#/definitions/full_refresh_stream"
    retriever: "#/definitions/retriever_no_pagination"
    name: issue_link_types
    primary_key: "id"
    $parameters:
      path: "issueLinkType"
      extract_field: "issueLinkTypes"

  # https://developer.atlassian.com/server/jira/platform/rest/v10002/api-group-settings/#api-rest-api-2-settings-columns-get
  issue_navigator_settings_stream:
    $ref: "#/definitions/full_refresh_stream"
    retriever:
      $ref: "#/definitions/retriever_no_pagination"
      record_selector: "#/definitions/selector_base"
    name: issue_navigator_settings
    $parameters:
      path: "settings/columns"

  # https://developer.atlassian.com/server/jira/platform/rest/v10002/api-group-notificationscheme/#api-rest-api-2-notificationscheme-get
  issue_notification_schemes_stream:
    $ref: "#/definitions/full_refresh_stream"
    name: issue_notification_schemes
    primary_key: "id"
    $parameters:
      path: "notificationscheme"
      extract_field: "values"

  # Jira Data Center v2: GET /rest/api/2/priority (returns array). Cloud uses priority/search with "values".
  issue_priorities_stream:
    $ref: "#/definitions/full_refresh_stream"
    name: issue_priorities
    primary_key: "id"
    retriever:
      $ref: "#/definitions/retriever_no_pagination"
      record_selector:
        type: RecordSelector
        extractor:
          type: CustomRecordExtractor
          class_name: "source_jira_data_center.components.extractors.ArrayOrValuesExtractor"
          field_path: []
    $parameters:
      path: "priority"

  # Jira Data Center v2: GET /rest/api/2/resolution (returns array). Cloud uses resolution/search with "values".
  issue_resolutions_stream:
    $ref: "#/definitions/full_refresh_stream"
    name: issue_resolutions
    primary_key: "id"
    retriever:
      $ref: "#/definitions/retriever_no_pagination"
      record_selector:
        type: RecordSelector
        extractor:
          type: CustomRecordExtractor
          class_name: "source_jira_data_center.components.extractors.ArrayOrValuesExtractor"
          field_path: []
    $parameters:
      path: "resolution"

  # https://developer.atlassian.com/server/jira/platform/rest/v10002/api-group-issuesecurityschemes/#api-rest-api-2-issuesecurityschemes-get
  issue_security_schemes_stream:
    $ref: "#/definitions/full_refresh_stream"
    retriever: "#/definitions/retriever_no_pagination"
    name: issue_security_schemes
    primary_key: "id"
    $parameters:
      path: "issuesecurityschemes"
      extract_field: "issueSecuritySchemes"

  # https://developer.atlassian.com/server/jira/platform/rest/v10002/api-group-issuetype/#api-group-issuetype
  issue_types_stream:
    $ref: "#/definitions/full_refresh_stream"
    retriever:
      $ref: "#/definitions/retriever_no_pagination"
      record_selector: "#/definitions/selector_base"
    name: issue_types
    primary_key: "id"
    $parameters:
      path: "issuetype"

  # https://developer.atlassian.com/server/jira/platform/rest/v10002/api-group-issuetypescheme/#api-rest-api-2-issuetypescheme-get
  issue_type_schemes_stream:
    $ref: "#/definitions/full_refresh_stream"
    name: issue_type_schemes
    primary_key: "id"
    $parameters:
      path: "issuetypescheme"
      extract_field: "values"

  # Issue type screen schemes; may not exist on all Data Center versions (ignore 404/403).
  # https://developer.atlassian.com/server/jira/platform/rest/v10002/api-group-issuetypescheme/
  issue_type_screen_schemes_stream:
    $ref: "#/definitions/full_refresh_stream"
    name: issue_type_screen_schemes
    primary_key: "id"
    retriever:
      $ref: "#/definitions/retriever"
      requester:
        $ref: "#/definitions/requester"
        error_handler: "#/definitions/error_handler_ignore_404"
    $parameters:
      path: "issuetypescreenscheme"
      extract_field: "values"

  # https://developer.atlassian.com/server/jira/platform/rest/v10002/api-group-application-properties/#api-rest-api-2-application-properties-get
  jira_settings_stream:
    $ref: "#/definitions/full_refresh_stream"
    retriever:
      $ref: "#/definitions/retriever_no_pagination"
      record_selector: "#/definitions/selector_base"
    name: jira_settings
    primary_key: "id"
    $parameters:
      path: "application-properties"

  # https://developer.atlassian.com/server/jira/platform/rest/v10002/api-group-field/#api-rest-api-2-label-get
  labels_stream:
    $ref: "#/definitions/full_refresh_stream"
    retriever:
      $ref: "#/definitions/retriever"
      record_selector:
        $ref: "#/definitions/retriever/record_selector"
        extractor:
          type: CustomRecordExtractor
          class_name: "source_jira_data_center.components.extractors.LabelsRecordExtractor"
          field_path: ["values"]
    name: labels
    primary_key: "label"
    $parameters:
      path: "label"

  # https://developer.atlassian.com/server/jira/platform/rest/v10002/api-group-permissions/#api-rest-api-2-permissions-get
  permissions_stream:
    $ref: "#/definitions/full_refresh_stream"
    retriever:
      $ref: "#/definitions/retriever_no_pagination"
      record_selector:
        $ref: "#/definitions/selector"
        extractor:
          $ref: "#/definitions/selector/extractor"
          field_path:
            - "permissions"
            - "*"
    name: permissions
    primary_key: "key"
    $parameters:
      path: "permissions"

  # https://developer.atlassian.com/server/jira/platform/rest/v10002/api-group-permissionscheme/#api-rest-api-2-permissionscheme-get
  permission_schemes_stream:
    $ref: "#/definitions/full_refresh_stream"
    retriever: "#/definitions/retriever_no_pagination"
    name: permission_schemes
    primary_key: "id"
    $parameters:
      path: "permissionscheme"
      extract_field: "permissionSchemes"

  # Jira Data Center v2: GET /rest/api/2/project returns an array of project objects (no wrapper).
  projects_stream:
    $ref: "#/definitions/full_refresh_stream"
    retriever:
      $ref: "#/definitions/retriever_no_pagination_use_cache"
      requester:
        $ref: "#/definitions/retriever_use_cache/requester"
        request_parameters:
          expand: "description,lead"
          includeArchived: "true"
      record_selector:
        type: RecordSelector
        extractor:
          type: CustomRecordExtractor
          class_name: "source_jira_data_center.components.extractors.ArrayOrValuesExtractor"
          field_path: []
    name: projects
    primary_key: "id"
    $parameters:
      path: "project"

  _non_deleted_projects:
    $ref: "#/definitions/projects_stream"
    retriever:
      $ref: "#/definitions/retriever_no_pagination_use_cache"
      record_selector:
        type: RecordSelector
        extractor:
          type: CustomRecordExtractor
          class_name: "source_jira_data_center.components.extractors.ArrayOrValuesExtractor"
          field_path: []
      requester:
        $ref: "#/definitions/retriever_use_cache/requester"
        request_parameters:
          expand: "description,lead"

  # https://developer.atlassian.com/server/jira/platform/rest/v10002/api-group-projectcategory/#api-rest-api-2-projectcategory-get
  project_categories_stream:
    $ref: "#/definitions/full_refresh_stream"
    retriever:
      $ref: "#/definitions/retriever_no_pagination"
      record_selector: "#/definitions/selector_base"
      requester:
        $ref: "#/definitions/requester"
        error_handler:
          $ref: "#/definitions/error_handler"
          response_filters:
            - http_codes: [400, 403]
              action: IGNORE
    name: project_categories
    primary_key: "id"
    $parameters:
      path: "projectCategory"

  # https://developer.atlassian.com/server/jira/platform/rest/v10002/api-group-role/#api-rest-api-2-role-get
  project_roles_stream:
    $ref: "#/definitions/full_refresh_stream"
    retriever:
      $ref: "#/definitions/retriever_no_pagination"
      record_selector: "#/definitions/selector_base"
    name: project_roles
    primary_key: "id"
    $parameters:
      path: "role"

  # https://developer.atlassian.com/server/jira/platform/rest/v10002/api-group-projects/#api-rest-api-2-project-type-get
  project_types_stream:
    $ref: "#/definitions/full_refresh_stream"
    retriever:
      $ref: "#/definitions/retriever_no_pagination"
      record_selector: "#/definitions/selector_base"
    name: project_types
    $parameters:
      path: "project/type"

  # https://developer.atlassian.com/server/jira/platform/rest/v10002/api-group-screens/#api-rest-api-2-screens-get
  screens_stream:
    $ref: "#/definitions/full_refresh_stream"
    name: screens
    primary_key: "id"
    retriever: "#/definitions/retriever_use_cache"
    $parameters:
      path: "screens"
      extract_field: "values"

  # Screen schemes; may not exist on all Data Center versions (ignore 404/403).
  # https://developer.atlassian.com/server/jira/platform/rest/v10002/api-group-screens/
  screen_schemes_stream:
    $ref: "#/definitions/full_refresh_stream"
    name: screen_schemes
    primary_key: "id"
    retriever:
      $ref: "#/definitions/retriever"
      requester:
        $ref: "#/definitions/requester"
        error_handler: "#/definitions/error_handler_ignore_404"
    $parameters:
      path: "screenscheme"
      extract_field: "values"

  # https://developer.atlassian.com/server/jira/platform/rest/v10002/api-group-configuration/#api-rest-api-2-configuration-timetracking-list-get
  time_tracking_stream:
    $ref: "#/definitions/full_refresh_stream"
    retriever:
      $ref: "#/definitions/retriever_no_pagination"
      record_selector: "#/definitions/selector_base"
    name: time_tracking
    primary_key: "key"
    $parameters:
      path: "configuration/timetracking/list"

  # https://developer.atlassian.com/server/jira/platform/rest/v10002/api-group-user/#api-rest-api-2-users-search-get
  users_stream:
    $ref: "#/definitions/full_refresh_stream"
    name: users
    primary_key: "accountId"
    retriever:
      $ref: "#/definitions/retriever_no_pagination_use_cache"
      paginator:
        $ref: "#/definitions/paginator"
        pagination_strategy:
          type: OffsetIncrement
          page_size: 50
      record_selector: "#/definitions/selector_base"
    $parameters:
      path: "users/search"

  # https://developer.atlassian.com/server/jira/platform/rest/v10002/api-group-workflow/#api-rest-api-2-workflow-search-get
  workflows_stream:
    $ref: "#/definitions/full_refresh_stream"
    name: workflows
    primary_key: [["entityId"], ["name"]]
    $parameters:
      path: "workflow/search"
      extract_field: "values"
    transformations:
      - type: AddFields
        fields:
          - path: ["entityId"]
            value_type: string
            value: "{{ record.id.entityId }}"
          - path: ["name"]
            value_type: string
            value: "{{ record.id.name }}"

  # https://developer.atlassian.com/server/jira/platform/rest/v10002/api-group-workflowscheme/#api-rest-api-2-workflowscheme-get
  workflow_schemes_stream:
    $ref: "#/definitions/full_refresh_stream"
    name: workflow_schemes
    primary_key: "id"
    $parameters:
      path: "workflowscheme"
      extract_field: "values"

  # https://developer.atlassian.com/server/jira/platform/rest/v10002/api-group-status/#api-rest-api-2-status-get
  workflow_statuses_stream:
    $ref: "#/definitions/full_refresh_stream"
    retriever:
      $ref: "#/definitions/retriever_no_pagination"
      record_selector: "#/definitions/selector_base"
    name: workflow_statuses
    primary_key: "id"
    $parameters:
      path: "status"

  # https://developer.atlassian.com/server/jira/platform/rest/v10002/api-group-statuscategory/#api-rest-api-2-statuscategory-get
  workflow_status_categories_stream:
    $ref: "#/definitions/full_refresh_stream"
    retriever:
      $ref: "#/definitions/retriever_no_pagination"
      record_selector: "#/definitions/selector_base"
    name: workflow_status_categories
    primary_key: "id"
    $parameters:
      path: "statuscategory"

  # Substream Based Fullrefresh Streams

  # https://developer.atlassian.com/server/jira/platform/rest/v10002/api-group-filter/#api-rest-api-2-filter-id-permission-get
  filter_sharing_stream:
    $ref: "#/definitions/full_refresh_stream"
    name: filter_sharing
    primary_key: "id"
    retriever:
      $ref: "#/definitions/retriever_no_pagination"
      record_selector: "#/definitions/selector_base"
      partition_router:
        type: SubstreamPartitionRouter
        parent_stream_configs:
          - type: ParentStreamConfig
            stream: "#/definitions/filters_stream"
            parent_key: "id"
            partition_field: "filter_id"
    transformations:
      - type: AddFields
        fields:
          - path: ["filterId"]
            value_type: string
            value: "{{ stream_slice.filter_id }}"
    $parameters:
      path: "filter/{{ stream_slice.filter_id }}/permission"

  # https://developer.atlassian.com/server/jira/platform/rest/v10002/api-group-field/#api-rest-api-2-field-get
  __custom_issue_fields_substream:
    $ref: "#/definitions/issue_fields_stream"
    retriever:
      $ref: "#/definitions/retriever_no_pagination_use_cache"
      record_selector:
        $ref: "#/definitions/selector_base"
        record_filter:
          condition: "{{ record.get('custom', False) }}"

  # https://developer.atlassian.com/server/jira/platform/rest/v10002/api-group-field/#api-rest-api-2-field-fieldid-context-get
  issue_custom_field_contexts_stream:
    $ref: "#/definitions/full_refresh_stream"
    name: issue_custom_field_contexts
    primary_key: "id"
    retriever:
      $ref: "#/definitions/retriever_use_cache"
      partition_router:
        type: CustomPartitionRouter
        class_name: "source_jira_data_center.components.partition_routers.SubstreamPartitionRouterWithContext"
        parent_stream_configs:
          - type: ParentStreamConfig
            stream: "#/definitions/__custom_issue_fields_substream"
            parent_key: "id"
            partition_field: "field_id"
      requester:
        $ref: "#/definitions/retriever_use_cache/requester"
        error_handler:
          $ref: "#/definitions/error_handler"
          response_filters:
            - http_codes: [400, 403, 404]
              action: IGNORE
    transformations:
      - type: AddFields
        fields:
          - path: ["fieldId"]
            value_type: string
            value: "{{ stream_slice.field_id }}"
          - path: ["fieldType"]
            value_type: string
            value: "{{ stream_slice.parent_record.schema.type }}"
    $parameters:
      path: "field/{{ stream_slice.field_id }}/context"
      extract_field: "values"

  # https://developer.atlassian.com/server/jira/platform/rest/v10002/api-group-field/#api-rest-api-2-field-fieldid-context-get
  __issue_custom_field_contexts_substream:
    $ref: "#/definitions/issue_custom_field_contexts_stream"
    retriever:
      $ref: "#/definitions/issue_custom_field_contexts_stream/retriever"
      record_selector:
        $ref: "#/definitions/selector"
        record_filter:
          condition: "{{ stream_slice.parent_record.schema.type == 'option' or stream_slice.parent_record.schema.get('items', '') == 'option'}}"

  # https://developer.atlassian.com/server/jira/platform/rest/v10002/api-group-customfieldoption/#api-rest-api-2-field-fieldid-context-contextid-option-get
  issue_custom_field_options_stream:
    $ref: "#/definitions/full_refresh_stream"
    name: issue_custom_field_options
    primary_key: "id"
    retriever:
      $ref: "#/definitions/retriever_use_cache"
      partition_router:
