documentationUrl: https://docsurl.com
connectionSpecification:
  $schema: http://json-schema.org/draft-07/schema#
  title: Gainsight CS Spec
  type: object
  required:
    - domain_url
    - client_secret
    - client_id
  properties:
    domain_url:
      type: string
      title: Domain URL
      examples:
        - "https://company-name.gainsightcloud.com"
    client_id:
      type: string
      title: Client ID
    client_secret:
      type: string
      title: Client Secret
      airbyte_secret: true
    lookback_730_day_streams:
      type: array
      title: Lookback 730 Day Streams
      description: >
        List of stream/object names that should look back 730 days on the first
        incremental sync (when there is no prior state). Streams not listed will
        perform a full scan on first sync.
      items:
        type: string
      examples:
        - ["time_series_daily"]
  additionalProperties: true
