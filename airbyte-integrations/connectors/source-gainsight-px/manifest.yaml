version: 4.3.0
type: DeclarativeSource
check:
  type: CheckStream
  stream_names:
    - admin_attributes
    - user_attributes
definitions:
  streams:
    accounts:
      type: DeclarativeStream
      name: accounts
      primary_key:
        - id
      retriever:
        type: SimpleRetriever
        requester:
          type: HttpRequester
          url_base: https://api.aptrinsic.com/v1
          authenticator:
            type: ApiKeyAuthenticator
            api_token: "{{ config['api_key'] }}"
            inject_into:
              type: RequestOption
              inject_into: header
              field_name: X-APTRINSIC-API-KEY
          path: /accounts
          http_method: GET
          request_parameters:
            lastModifiedDate: "{{ stream_slice.get('lastModifiedDate', '') }}"
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - accounts
      incremental_sync:
        type: DatetimeBasedCursor
        cursor_field: lastModifiedDate
        datetime_format: "%Y-%m-%dT%H:%M:%S.%fZ"
        cursor_granularity: PT1S
        start_datetime:
          type: MinMaxDatetime
          datetime: "{{ config.get('start_date', '2020-01-01T00:00:00.000Z') }}"
          datetime_format: "%Y-%m-%dT%H:%M:%S.%fZ"
