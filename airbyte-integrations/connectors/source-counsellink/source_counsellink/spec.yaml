documentationUrl: https://api.counsellink.net/api/
connectionSpecification:
  $schema: http://json-schema.org/draft-07/schema#
  title: CounselLink Spec
  type: object
  required:
    - access_key
    - secret_key
  properties:
    access_key:
      type: string
      description: CounselLink API access key
      title: Access Key
      airbyte_secret: true
    secret_key:
      type: string
      description: CounselLink API secret key
      title: Secret Key
      airbyte_secret: true
    server:
      type: string
      description: CounselLink API server hostname
      title: Server
      default: api-cve11.counsellink.net
      examples:
        - api-cve11.counsellink.net
